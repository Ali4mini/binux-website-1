{% load static %}<section class="dark-section"><div class="reference-stars" aria-hidden="true"></div><div class="container"><div class="section-heading"><h2>{{ c.principle_heading }}</h2><p>{{ c.principle_intro }}</p></div><article class="reference-proof"><div class="proof-image"><img src="{% static 'website/projects/meshcat-dashboard-demo.png' %}" alt="{{ c.demo }}" width="1440" height="960" loading="lazy"><small>{{ c.demo }}</small></div><div class="proof-copy"><div class="proof-quote" aria-hidden="true">“</div><h3>{{ c.proof_title }}</h3><p>{{ c.proof_body }}</p><strong>{{ c.brand }}</strong><p>{{ c.team_note }}</p><a class="button" href="{% url 'website:process' lang=lang %}">{{ c.process }}</a></div></article><div class="principles-grid">{% for p in c.principles %}<article class="principle"><svg class="icon"><use href="{% cycle '#i-spark' '#i-code' '#i-check' %}"/></svg><h3>{{ p.0 }}</h3><p>{{ p.1 }}</p><a class="text-link" href="{% url 'website:process' lang=lang %}">{{ c.process }}<svg class="icon arrow"><use href="#i-arrow"/></svg></a></article>{% endfor %}</div></div></section>
