{% load static %}<section class="section container technology"><div class="section-heading"><h2>{{ c.tech_heading }}</h2><p>{{ c.tech_intro }}</p></div><div class="technology-frame"><div class="tech-tabs" role="tablist" aria-orientation="vertical" aria-label="{{ c.tech_heading }}">{% for group in technology_groups %}<button role="tab" id="tech-tab-{{ forloop.counter }}" aria-selected="{% if forloop.first %}true{% else %}false{% endif %}" aria-controls="tech-panel-{{ forloop.counter }}" tabindex="{% if forloop.first %}0{% else %}-1{% endif %}"><svg class="icon"><use href="#i-{% cycle 'bot' 'web' 'code' 'system' 'system' 'spark' 'bot' 'check' %}"/></svg>{{ group.title }}</button>{% endfor %}</div>{% for group in technology_groups %}<div role="tabpanel" id="tech-panel-{{ forloop.counter }}" aria-labelledby="tech-tab-{{ forloop.counter }}" tabindex="0" {% if not forloop.first %}hidden{% endif %}><div class="tech-grid">{% for tool in group.tools %}<span>{% if tool.logo %}<img class="tech-logo" src="{% static tool.logo %}" alt="" width="24" height="24" loading="lazy">{% else %}<svg class="icon"><use href="#i-code"/></svg>{% endif %}{{ tool.title }}</span>{% endfor %}</div></div>{% endfor %}</div></section>
