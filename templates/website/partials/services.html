<div class="services-layout"><nav class="service-index" aria-label="{{ c.services }}">{% for s in services %}<a href="#service-{{ s.slug }}"{% if forloop.first %} class="active"{% endif %}>{{ s.title }}<svg class="icon arrow"><use href="#i-arrow"/></svg></a>{% endfor %}</nav><div class="service-list">{% for s in services %}<article class="service-card reveal" id="service-{{ s.slug }}"><svg class="service-icon icon"><use href="#i-{{ s.icon }}"/></svg><h3><a href="{% url 'website:service' lang=lang slug=s.slug %}">{{ s.title }}</a></h3><p>{{ s.description }}</p><a class="text-link" href="{% url 'website:service' lang=lang slug=s.slug %}">{{ c.learn }} <svg class="icon arrow"><use href="#i-arrow"/></svg></a></article>{% endfor %}</div></div>
